name: Deploy Tevel PWA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build dashboard data
        run: npm run build:data
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -R dashboard/. _site/
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          # Ensure relative asset paths resolve from site root
          test -f _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
